<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ISUWAYA MAYORISTA — Pedidos</title>
<meta name="description" content="Catálogo mayorista de ISUWAYA. Armá tu pedido por talle o por curva y descargá el detalle.">
<meta name="theme-color" content="#ffffff">
<link rel="icon" type="image/png" sizes="32x32" href="/img/icono-32.png">
<link rel="apple-touch-icon" href="/img/icono-180.png">
<link rel="preload" href="/fuentes/InstrumentSans-Regular.ttf" as="font" type="font/ttf" crossorigin>
<link rel="stylesheet" href="/css/estilos.css">
<link rel="stylesheet" href="/css/seguimiento.css">
</head>
<body>

<a class="saltar" href="#catalogo">Ir al catálogo</a>

<header class="principal">
  <div class="barra">
    <a class="marca" href="/">
      <img src="/img/logo-isuwaya.png" alt="" width="51" height="40">
      <span class="marca-texto">ISUWAYA <span>MAYORISTA</span><small>PEDIDOS ONLINE</small></span>
    </a>
    <div class="estado-sesion" id="estado-sesion"></div>
  </div>
</header>

<div class="buscador">
  <label class="campo-buscar">
    <span class="lupa" aria-hidden="true">⌕</span>
    <input type="search" id="buscar" autocomplete="off" spellcheck="false"
           placeholder="Buscar producto o categoría" aria-label="Buscar producto o categoría">
    <button type="button" class="limpiar" id="buscar-limpiar" aria-label="Borrar la búsqueda" hidden>✕</button>
  </label>
</div>

<nav class="categorias" aria-label="Categorías">
  <div class="categorias-lista" id="categorias"></div>
</nav>

<main id="catalogo">
  <p class="cargando">Cargando el catálogo…</p>
</main>

<!-- Botón flotante. Nace oculto y aparece con el primer ítem. -->
<button class="flotante" id="flotante" hidden>
  <span>
    Hacer pedido
    <span class="cuenta-items" id="flotante-detalle"></span>
  </span>
  <span class="ir" id="flotante-total">$ 0</span>
</button>

<!-- ── Panel del producto ───────────────────────────────────────── -->
<div class="telon" id="telon"></div>
<aside class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="panel-titulo" tabindex="-1" hidden>
  <header>
    <div>
      <h2 id="panel-titulo"></h2>
      <p class="sku" id="panel-sku"></p>
    </div>
    <button class="cerrar" id="panel-cerrar" aria-label="Cerrar">✕</button>
  </header>
  <div class="contenido" id="panel-contenido"></div>
  <footer>
    <div class="resumen">
      <span id="panel-unidades">Items: 0</span>
      <b id="panel-subtotal">Total: $ 0</b>
    </div>
    <button class="btn" id="panel-agregar">Añadir al carrito</button>
  </footer>
</aside>

<!-- ── Diálogo del pedido ───────────────────────────────────────── -->
<div class="dialogo" id="dialogo" role="dialog" aria-modal="true" aria-labelledby="dialogo-titulo">
  <div class="caja">
    <header>
      <h2 id="dialogo-titulo">Tu pedido</h2>
      <button class="cerrar" id="dialogo-cerrar" aria-label="Cerrar">✕</button>
    </header>
    <div class="cuerpo" id="dialogo-cuerpo"></div>
    <div class="pie" id="dialogo-pie"></div>
  </div>
</div>

<!-- ── Diálogo de cuenta: entrar, registrarse, mis datos ──────────── -->
<div class="dialogo" id="dialogo-cuenta" role="dialog" aria-modal="true" aria-labelledby="cuenta-titulo">
  <div class="caja">
    <header>
      <h2 id="cuenta-titulo">Entrar</h2>
      <button class="cerrar" id="cuenta-cerrar" aria-label="Cerrar">✕</button>
    </header>
    <div class="cuerpo" id="cuenta-cuerpo"></div>
    <div class="pie" id="cuenta-pie"></div>
  </div>
</div>

<!-- ── Guía de talles del producto ────────────────────────────────── -->
<div class="dialogo" id="dialogo-guia" role="dialog" aria-modal="true" aria-labelledby="guia-titulo">
  <div class="caja">
    <header>
      <h2 id="guia-titulo">Guía de talles</h2>
      <button class="cerrar" id="guia-cerrar" aria-label="Cerrar">✕</button>
    </header>
    <div class="cuerpo" id="guia-cuerpo"></div>
  </div>
</div>

<script type="module" src="/js/app.js"></script>
</body>
</html>
