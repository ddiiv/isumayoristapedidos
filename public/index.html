<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ISUWAYA MAYORISTA — Pedidos</title>
<meta name="description" content="Catálogo mayorista de ISUWAYA. Armá tu pedido por talle o por curva y descargá el detalle.">
<meta name="theme-color" content="#01317a">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2301317a'/%3E%3Ctext x='16' y='22' font-family='Arial' font-size='16' font-weight='700' fill='%23fff' text-anchor='middle'%3EI%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/css/estilos.css">
</head>
<body>

<header class="principal">
  <div class="barra">
    <div class="marca">ISUWAYA <span>MAYORISTA</span><small>PEDIDOS ONLINE</small></div>
  </div>
</header>

<nav class="categorias" aria-label="Categorías">
  <div class="categorias-lista" id="categorias"></div>
</nav>

<main id="catalogo">
  <p class="cargando">Cargando el catálogo…</p>
</main>

<!-- Botón flotante. Nace oculto y aparece con el primer ítem. -->
<button class="flotante" id="flotante" hidden>
  <span>
    Hacer pedido
    <span class="cuenta-items" id="flotante-detalle"></span>
  </span>
  <span class="ir" id="flotante-total">$ 0</span>
</button>

<!-- ── Panel del producto ───────────────────────────────────────── -->
<div class="telon" id="telon"></div>
<aside class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="panel-titulo" tabindex="-1" hidden>
  <header>
    <div>
      <h2 id="panel-titulo"></h2>
      <p class="sku" id="panel-sku"></p>
    </div>
    <button class="cerrar" id="panel-cerrar" aria-label="Cerrar">✕</button>
  </header>
  <div class="contenido" id="panel-contenido"></div>
  <footer>
    <div class="resumen">
      <span id="panel-unidades">0 unidades</span>
      <b id="panel-subtotal">$ 0</b>
    </div>
    <button class="btn" id="panel-agregar">Agregar al pedido</button>
  </footer>
</aside>

<!-- ── Diálogo del pedido ───────────────────────────────────────── -->
<div class="dialogo" id="dialogo" role="dialog" aria-modal="true" aria-labelledby="dialogo-titulo">
  <div class="caja">
    <header>
      <h2 id="dialogo-titulo">Tu pedido</h2>
      <button class="cerrar" id="dialogo-cerrar" aria-label="Cerrar">✕</button>
    </header>
    <div class="cuerpo" id="dialogo-cuerpo"></div>
    <div class="pie" id="dialogo-pie"></div>
  </div>
</div>

<script type="module" src="/js/app.js"></script>
</body>
</html>
